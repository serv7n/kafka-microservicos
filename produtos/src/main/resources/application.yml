spring:
  application:
    name: produtos
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5555/icomprasprodutos
    username: postgres
    password: postgres
  jpa:
    database-platform: org.hibernete.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        show_sql: true

server:
  port: 8081